{% extends "base.html" %}


{% block content %}


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">

<h4>
➕ Ajouter une UE QHSE
</h4>

</div>



<div class="card-body">


<form method="POST">

{% csrf_token %}

<input type="hidden" name="session" value="{{ session }}">

<div class="mb-3">
    <label>Niveau</label>
    <select name="niveau" class="form-control" required>
        <option value="L1" {% if niveau == "L1" %}selected{% endif %}>L1</option>
        <option value="L2" {% if niveau == "L2" %}selected{% endif %}>L2</option>
        <option value="L3" {% if niveau == "L3" %}selected{% endif %}>L3</option>
    </select>
</div>

<div class="mb-3">
    <label>Semestre</label>
    <select name="semestre" class="form-control" required>
        <option value="S1" {% if semestre == "S1" %}selected{% endif %}>S1</option>
        <option value="S2" {% if semestre == "S2" %}selected{% endif %}>S2</option>
    </select>
</div>

<div class="mb-3">
    <label>Grande unité</label>
    <select name="grande_unite" class="form-control" required>
        <option value="">-- Choisir une grande unité --</option>
        {% for gu in grandes_unites %}
            <option value="{{ gu.id }}">{{ gu.code }} - {{ gu.nom }}</option>
        {% endfor %}
    </select>
    {% if not grandes_unites %}
    <small class="text-danger">
        Aucune grande unité pour ce niveau/semestre. Crée-la d'abord
        avant d'ajouter une UE.
    </small>
    {% endif %}
</div>

<div class="mb-3">

<label>
Code UE
</label>

<input 
type="text"
name="code"
class="form-control"
placeholder="Ex: QHSE301"
required>

</div>



<div class="mb-3">

<label>
Libellé UE
</label>

<input 
type="text"
name="libelle"
class="form-control"
placeholder="Nom de l'UE"
required>

</div>



<div class="mb-3">

<label>
Crédit
</label>

<input 
type="number"
name="credit"
class="form-control"
value="6">

</div>

<div class="mb-3">
    <label>Ordre</label>
    <input
    type="number"
    name="ordre"
    class="form-control"
    value="1">
</div>



<button class="btn btn-success">

💾 Enregistrer

</button>


<a href="{% url 'l3_qhse_ue' %}" 
class="btn btn-secondary">

Retour

</a>



</form>


</div>


</div>


</div>


{% endblock %}
